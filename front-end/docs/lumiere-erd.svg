<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1420" viewBox="0 0 2000 1420" role="img" aria-labelledby="title desc">
  <title id="title">Lumière Cosmetics Shop Entity Relationship Diagram</title>
  <desc id="desc">Database entity relationship diagram inferred from the React front-end, covering users, brands, categories, products, customer orders, and order items. The cart is browser-local and is not a database table.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F2"/>
      <stop offset="1" stop-color="#F1F3E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#40563B" flood-opacity="0.12"/>
    </filter>
    <marker id="one" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M4 1V11 M8 1V11" stroke="#71865A" stroke-width="2" fill="none"/>
    </marker>
    <marker id="many" markerWidth="18" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 8L13 2 M2 8L13 8 M2 8L13 14" stroke="#71865A" stroke-width="2" fill="none"/>
      <circle cx="16" cy="8" r="2.5" fill="none" stroke="#71865A" stroke-width="1.8"/>
    </marker>
    <marker id="many-required" markerWidth="18" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 8L13 2 M2 8L13 8 M2 8L13 14 M16 2V14" stroke="#71865A" stroke-width="2" fill="none"/>
    </marker>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 54px; font-weight: 600; fill: #2D392A; }
      .subtitle { font-family: Arial, sans-serif; font-size: 20px; fill: #6F7166; }
      .entity-title { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; font-weight: 700; fill: #FFFFFF; letter-spacing: .5px; }
      .field { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; fill: #2B3027; }
      .field-muted { fill: #72756B; }
      .key { font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .8px; }
      .rel { fill: none; stroke: #71865A; stroke-width: 3; marker-start: url(#one); marker-end: url(#many); }
      .rel-required { fill: none; stroke: #71865A; stroke-width: 3; marker-start: url(#one); marker-end: url(#many-required); }
      .rel-label { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #40563B; letter-spacing: .4px; }
      .note-title { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #40563B; }
      .note { font-family: Arial, sans-serif; font-size: 16px; fill: #5C6155; }
    </style>
  </defs>

  <rect width="2000" height="1420" fill="url(#page)"/>
  <circle cx="1840" cy="90" r="180" fill="#E4E8D5" opacity="0.65"/>
  <circle cx="110" cy="1360" r="210" fill="#F4DFDD" opacity="0.5"/>

  <text x="78" y="78" class="title">Lumière Cosmetics Shop — ERD</text>
  <text x="80" y="116" class="subtitle">Inferred from the React storefront, admin forms, checkout flow, and API contract</text>

  <g transform="translate(1375 56)">
    <rect width="510" height="105" rx="16" fill="#FFFFFF" stroke="#D9DEC9"/>
    <circle cx="28" cy="27" r="8" fill="#71865A"/>
    <text x="46" y="33" class="note-title">Relationship notation</text>
    <text x="24" y="62" class="note">one  ││───  ○&lt;  zero or many</text>
    <text x="24" y="88" class="note">one  ││───  │&lt;  one or many</text>
  </g>

  <!-- Relationships are drawn before cards so their ends tuck beneath card edges. -->
  <path class="rel" d="M510 458 H620 Q650 458 650 488 H720"/>
  <text x="563" y="441" class="rel-label">groups</text>

  <path class="rel" d="M510 928 H610 Q650 928 650 704 H720"/>
  <text x="540" y="910" class="rel-label">classifies</text>

  <path class="rel" d="M970 850 V940"/>
  <text x="990" y="928" class="rel-label">referenced by</text>

  <path class="rel" d="M1678 544 V650"/>
  <text x="1698" y="570" class="rel-label">places</text>

  <path class="rel-required" d="M1440 1090 H1330 Q1290 1090 1290 1135 H1220"/>
  <text x="1303" y="1071" class="rel-label">contains</text>

  <!-- BRANDS -->
  <g transform="translate(80 315)" filter="url(#shadow)">
    <rect width="430" height="292" rx="22" fill="#FFFFFF" stroke="#D9DEC9" stroke-width="2"/>
    <path d="M22 0H408Q430 0 430 22V70H0V22Q0 0 22 0Z" fill="#71865A"/>
    <text x="24" y="46" class="entity-title">BRANDS</text>
    <g transform="translate(24 96)">
      <rect x="0" y="-15" width="31" height="22" rx="6" fill="#E4E8D5"/><text x="7" y="1" class="key" fill="#40563B">PK</text>
      <text x="47" y="2" class="field">id</text><text x="190" y="2" class="field field-muted">BIGINT</text>
      <line x1="0" y1="26" x2="382" y2="26" stroke="#EEF0E7"/>
      <text x="47" y="58" class="field">name</text><text x="190" y="58" class="field field-muted">VARCHAR</text>
      <text x="47" y="102" class="field">slug</text><text x="190" y="102" class="field field-muted">VARCHAR</text>
      <text x="47" y="146" class="field">active</text><text x="190" y="146" class="field field-muted">BOOLEAN</text>
    </g>
  </g>

  <!-- CATEGORIES -->
  <g transform="translate(80 785)" filter="url(#shadow)">
    <rect width="430" height="292" rx="22" fill="#FFFFFF" stroke="#E8D4D3" stroke-width="2"/>
    <path d="M22 0H408Q430 0 430 22V70H0V22Q0 0 22 0Z" fill="#A86C6A"/>
    <text x="24" y="46" class="entity-title">CATEGORIES</text>
    <g transform="translate(24 96)">
      <rect x="0" y="-15" width="31" height="22" rx="6" fill="#F4DFDD"/><text x="7" y="1" class="key" fill="#7E4B4A">PK</text>
      <text x="47" y="2" class="field">id</text><text x="190" y="2" class="field field-muted">BIGINT</text>
      <line x1="0" y1="26" x2="382" y2="26" stroke="#F3E7E6"/>
      <text x="47" y="58" class="field">name</text><text x="190" y="58" class="field field-muted">VARCHAR</text>
      <text x="47" y="102" class="field">slug</text><text x="190" y="102" class="field field-muted">VARCHAR</text>
      <text x="47" y="146" class="field">active</text><text x="190" y="146" class="field field-muted">BOOLEAN</text>
    </g>
  </g>

  <!-- PRODUCTS -->
  <g transform="translate(720 205)" filter="url(#shadow)">
    <rect width="500" height="645" rx="22" fill="#FFFFFF" stroke="#C8D2BA" stroke-width="2"/>
    <path d="M22 0H478Q500 0 500 22V70H0V22Q0 0 22 0Z" fill="#40563B"/>
    <text x="24" y="46" class="entity-title">PRODUCTS</text>
    <g transform="translate(24 98)">
      <rect x="0" y="-15" width="31" height="22" rx="6" fill="#E4E8D5"/><text x="7" y="1" class="key" fill="#40563B">PK</text>
      <text x="47" y="2" class="field">id</text><text x="288" y="2" class="field field-muted">BIGINT</text>
      <line x1="0" y1="25" x2="452" y2="25" stroke="#EEF0E7"/>
      <text x="47" y="55" class="field">sku</text><text x="288" y="55" class="field field-muted">VARCHAR UK</text>
      <text x="47" y="94" class="field">name</text><text x="288" y="94" class="field field-muted">VARCHAR</text>
      <rect x="0" y="112" width="31" height="22" rx="6" fill="#F4DFDD"/><text x="7" y="128" class="key" fill="#7E4B4A">FK</text>
      <text x="47" y="129" class="field">brand_id</text><text x="288" y="129" class="field field-muted">BIGINT</text>
      <rect x="0" y="147" width="31" height="22" rx="6" fill="#F4DFDD"/><text x="7" y="163" class="key" fill="#7E4B4A">FK</text>
      <text x="47" y="164" class="field">category_id</text><text x="288" y="164" class="field field-muted">BIGINT</text>
      <text x="47" y="203" class="field">price</text><text x="288" y="203" class="field field-muted">NUMERIC(12,2)</text>
      <text x="47" y="242" class="field">description</text><text x="288" y="242" class="field field-muted">TEXT</text>
      <text x="47" y="281" class="field">image_url</text><text x="288" y="281" class="field field-muted">VARCHAR</text>
      <text x="47" y="320" class="field">stock_quantity</text><text x="288" y="320" class="field field-muted">INTEGER</text>
      <text x="47" y="359" class="field">status</text><text x="288" y="359" class="field field-muted">VARCHAR</text>
      <text x="47" y="398" class="field">featured</text><text x="288" y="398" class="field field-muted">BOOLEAN</text>
      <text x="47" y="437" class="field">version</text><text x="288" y="437" class="field field-muted">BIGINT</text>
      <text x="47" y="476" class="field">created_at</text><text x="288" y="476" class="field field-muted">TIMESTAMPTZ</text>
      <text x="47" y="515" class="field">updated_at</text><text x="288" y="515" class="field field-muted">TIMESTAMPTZ</text>
    </g>
  </g>

  <!-- USERS -->
  <g transform="translate(1460 165)" filter="url(#shadow)">
    <rect width="430" height="379" rx="22" fill="#FFFFFF" stroke="#D9DEC9" stroke-width="2"/>
    <path d="M22 0H408Q430 0 430 22V70H0V22Q0 0 22 0Z" fill="#71865A"/>
    <text x="24" y="46" class="entity-title">USERS</text>
    <g transform="translate(24 96)">
      <rect x="0" y="-15" width="31" height="22" rx="6" fill="#E4E8D5"/><text x="7" y="1" class="key" fill="#40563B">PK</text>
      <text x="47" y="2" class="field">id</text><text x="236" y="2" class="field field-muted">BIGINT</text>
      <line x1="0" y1="26" x2="382" y2="26" stroke="#EEF0E7"/>
      <text x="47" y="54" class="field">full_name</text><text x="236" y="54" class="field field-muted">VARCHAR</text>
      <text x="47" y="89" class="field">email</text><text x="236" y="89" class="field field-muted">VARCHAR UK</text>
      <text x="47" y="124" class="field">password_hash</text><text x="236" y="124" class="field field-muted">VARCHAR</text>
      <text x="47" y="159" class="field">role</text><text x="236" y="159" class="field field-muted">VARCHAR</text>
      <text x="47" y="194" class="field">status</text><text x="236" y="194" class="field field-muted">VARCHAR</text>
      <text x="47" y="229" class="field">created_at</text><text x="236" y="229" class="field field-muted">TIMESTAMPTZ</text>
      <text x="47" y="264" class="field">updated_at</text><text x="236" y="264" class="field field-muted">TIMESTAMPTZ</text>
    </g>
  </g>

  <!-- CUSTOMER ORDERS -->
  <g transform="translate(1440 650)" filter="url(#shadow)">
    <rect width="480" height="560" rx="22" fill="#FFFFFF" stroke="#E8D4D3" stroke-width="2"/>
    <path d="M22 0H458Q480 0 480 22V70H0V22Q0 0 22 0Z" fill="#7E4B4A"/>
    <text x="24" y="46" class="entity-title">CUSTOMER_ORDERS</text>
    <g transform="translate(24 98)">
      <rect x="0" y="-15" width="31" height="22" rx="6" fill="#F4DFDD"/><text x="7" y="1" class="key" fill="#7E4B4A">PK</text>
      <text x="47" y="2" class="field">id</text><text x="286" y="2" class="field field-muted">BIGINT</text>
      <line x1="0" y1="25" x2="432" y2="25" stroke="#F3E7E6"/>
      <text x="47" y="53" class="field">order_number</text><text x="286" y="53" class="field field-muted">VARCHAR UK</text>
      <rect x="0" y="70" width="31" height="22" rx="6" fill="#E4E8D5"/><text x="7" y="86" class="key" fill="#40563B">FK</text>
      <text x="47" y="87" class="field">user_id</text><text x="286" y="87" class="field field-muted">BIGINT</text>
      <text x="47" y="121" class="field">status</text><text x="286" y="121" class="field field-muted">VARCHAR</text>
      <text x="47" y="155" class="field">total_amount</text><text x="286" y="155" class="field field-muted">NUMERIC(12,2)</text>
      <text x="47" y="189" class="field">customer_name</text><text x="286" y="189" class="field field-muted">VARCHAR</text>
      <text x="47" y="223" class="field">customer_email</text><text x="286" y="223" class="field field-muted">VARCHAR</text>
      <text x="47" y="257" class="field">phone</text><text x="286" y="257" class="field field-muted">VARCHAR</text>
      <text x="47" y="291" class="field">delivery_address</text><text x="286" y="291" class="field field-muted">TEXT</text>
      <text x="47" y="325" class="field">city</text><text x="286" y="325" class="field field-muted">VARCHAR</text>
      <text x="47" y="359" class="field">payment_method</text><text x="286" y="359" class="field field-muted">VARCHAR</text>
      <text x="47" y="393" class="field">created_at</text><text x="286" y="393" class="field field-muted">TIMESTAMPTZ</text>
      <text x="47" y="427" class="field">updated_at</text><text x="286" y="427" class="field field-muted">TIMESTAMPTZ</text>
    </g>
  </g>

  <!-- ORDER ITEMS -->
  <g transform="translate(720 940)" filter="url(#shadow)">
    <rect width="500" height="390" rx="22" fill="#FFFFFF" stroke="#C8D2BA" stroke-width="2"/>
    <path d="M22 0H478Q500 0 500 22V70H0V22Q0 0 22 0Z" fill="#40563B"/>
    <text x="24" y="46" class="entity-title">ORDER_ITEMS</text>
    <g transform="translate(24 98)">
      <rect x="0" y="-15" width="31" height="22" rx="6" fill="#E4E8D5"/><text x="7" y="1" class="key" fill="#40563B">PK</text>
      <text x="47" y="2" class="field">id</text><text x="300" y="2" class="field field-muted">BIGINT</text>
      <rect x="0" y="23" width="31" height="22" rx="6" fill="#F4DFDD"/><text x="7" y="39" class="key" fill="#7E4B4A">FK</text>
      <text x="47" y="40" class="field">order_id</text><text x="300" y="40" class="field field-muted">BIGINT</text>
      <rect x="0" y="61" width="31" height="22" rx="6" fill="#F4DFDD"/><text x="7" y="77" class="key" fill="#7E4B4A">FK</text>
      <text x="47" y="78" class="field">product_id</text><text x="300" y="78" class="field field-muted">BIGINT</text>
      <text x="47" y="116" class="field">product_sku</text><text x="300" y="116" class="field field-muted">VARCHAR</text>
      <text x="47" y="154" class="field">product_name</text><text x="300" y="154" class="field field-muted">VARCHAR</text>
      <text x="47" y="192" class="field">unit_price</text><text x="300" y="192" class="field field-muted">NUMERIC(12,2)</text>
      <text x="47" y="230" class="field">quantity</text><text x="300" y="230" class="field field-muted">INTEGER</text>
      <text x="47" y="268" class="field">line_total</text><text x="300" y="268" class="field field-muted">NUMERIC(12,2)</text>
    </g>
  </g>

  <!-- Implementation boundary note -->
  <g transform="translate(80 1175)">
    <rect width="530" height="145" rx="20" fill="#FFFFFF" stroke="#D9DEC9" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="24" y="38" class="note-title">MVP boundary: no CART table</text>
    <text x="24" y="70" class="note">The React app stores cart items in localStorage.</text>
    <text x="24" y="98" class="note">Checkout submits only productId + quantity;</text>
    <text x="24" y="126" class="note">the API recalculates authoritative prices.</text>
  </g>

  <text x="80" y="1380" class="subtitle">PK = Primary Key   ·   FK = Foreign Key   ·   UK = Unique Key   ·   Product and order-item snapshots preserve order history</text>
</svg>
