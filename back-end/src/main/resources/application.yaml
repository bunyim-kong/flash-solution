spring:
  application:
    name: back-end
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lumiere_db}
    username: user
    password: user@12345

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

lumiere:
  seed-catalogue: ${LUMIERE_SEED_CATALOGUE:false}
